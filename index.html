<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Saber Eating - ASCII Art</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    height: 100vh;
    overflow: hidden;
    background: #000000;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 12px 8px;
    font-family: 'Press Start 2P', monospace;
    color: #ffffff;
  }

  h1 {
    font-family: 'Press Start 2P', monospace;
    font-size: clamp(8px, 2vw, 16px);
    line-height: 1.4;
    text-align: center;
    letter-spacing: 1px;
    color: #ffffff;
    text-shadow:
      3px 3px 0 #888888,
      -1px -1px 0 #444444;
    margin: 0 0 8px;
    padding: 0 8px;
    max-width: 900px;
    white-space: nowrap;
    flex: 0 0 auto;
  }

  #ascii-wrap {
    flex: 1 1 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 0;
    width: 100%;
  }

  pre#ascii {
    margin: 0;
    font-family: 'Courier New', monospace;
    font-size: 10px;
    line-height: 10px;
    letter-spacing: 2px;
    color: #ffffff;
    background: #000000;
    white-space: pre;
    transform-origin: center center;
  }

  footer {
    margin-top: 8px;
    font-family: 'Press Start 2P', monospace;
    font-size: 10px;
    letter-spacing: 1px;
    color: #888888;
    text-align: center;
    flex: 0 0 auto;
  }
</style>
</head>
<body>

  <h1>Here's an ASCII art of Saber eating</h1>

  <pre id="ascii"></pre>

  <footer>made by ritsukasu</footer>

  <script src="frames.js"></script>
  <script>
    const el = document.getElementById('ascii');
    let i = 0;
    function tick() {
      el.textContent = frames[i];
      i = (i + 1) % frames.length;
    }
    tick();
    setInterval(tick, 150);
  </script>

</body>
</html>
